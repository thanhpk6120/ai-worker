<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="#818cf8" stroke-width="1.5" />

  <!-- Microchip Outer Pins -->
  <!-- Top pins -->
  <line x1="24" y1="11" x2="24" y2="17" stroke="#c7d2fe" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="11" x2="32" y2="17" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="40" y1="11" x2="40" y2="17" stroke="#c7d2fe" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Bottom pins -->
  <line x1="24" y1="47" x2="24" y2="53" stroke="#c7d2fe" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="47" x2="32" y2="53" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="40" y1="47" x2="40" y2="53" stroke="#c7d2fe" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Left pins -->
  <line x1="11" y1="24" x2="17" y2="24" stroke="#c7d2fe" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="11" y1="32" x2="17" y2="32" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="11" y1="40" x2="17" y2="40" stroke="#c7d2fe" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Right pins -->
  <line x1="47" y1="24" x2="53" y2="24" stroke="#c7d2fe" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="47" y1="32" x2="53" y2="32" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="47" y1="40" x2="53" y2="40" stroke="#c7d2fe" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Chip Body -->
  <rect x="17" y="17" width="30" height="30" rx="6" fill="url(#chip)" stroke="#a5b4fc" stroke-width="2"/>

  <!-- AI Core Core Glow / Circuit -->
  <circle cx="32" cy="32" r="7" fill="url(#glow)" />
  <circle cx="32" cy="32" r="3.5" fill="#ffffff" />
  
  <!-- Subtle diagonal circuit corners -->
  <circle cx="23" cy="23" r="1.5" fill="#818cf8"/>
  <circle cx="41" cy="23" r="1.5" fill="#c084fc"/>
  <circle cx="23" cy="41" r="1.5" fill="#38bdf8"/>
  <circle cx="41" cy="41" r="1.5" fill="#818cf8"/>
</svg>